name: Diald
options:
  bundleIdPrefix: club.diald
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.40.0

targets:
  Diald:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Diald
    resources:
      - path: Diald/Resources
        optional: true
    info:
      path: Diald/Info.plist
      properties:
        CFBundleDisplayName: Diald
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Diald uses the camera to photograph bean bags and brew setups.
        NSPhotoLibraryAddUsageDescription: Diald saves bean and brew photos you choose to export.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - diald
            CFBundleURLName: club.diald.auth
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        SENTRY_DSN: $(SENTRY_DSN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.diald
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: Diald/Diald.entitlements
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Lottie
        product: Lottie
      - package: Sentry
        product: Sentry
      - target: DialdWidgets
        embed: true

  DialdWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DialdWidgets
      - path: Diald/Widgets/WidgetSnapshotStore.swift
    info:
      path: DialdWidgets/Info.plist
      properties:
        CFBundleDisplayName: Diald Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.diald.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: DialdWidgets/DialdWidgets.entitlements
        SKIP_INSTALL: YES
