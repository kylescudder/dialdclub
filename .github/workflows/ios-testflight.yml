name: iOS · TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Diald/**'
      - 'DialdTests/**'
      - 'DialdWidgets/**'
      - 'project.yml'
      - 'Config/Secrets.xcconfig.example'
      - 'Scripts/ci/**'
      - '.github/workflows/ios-testflight.yml'

permissions:
  contents: read

concurrency:
  group: diald-ios-testflight
  cancel-in-progress: false

jobs:
  build:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SCHEME: Diald
      ARCHIVE_PATH: build/Diald.xcarchive
      EXPORT_PATH: build/ipa
      EXPORT_OPTIONS: Scripts/ci/ExportOptions.plist
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_DIALD_PROFILE_BASE64: ${{ secrets.IOS_DIALD_PROFILE_BASE64 }}
      IOS_DIALD_WIDGETS_PROFILE_BASE64: ${{ secrets.IOS_DIALD_WIDGETS_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: sudo xcodebuild -downloadPlatform iOS || true
      - run: brew install xcodegen
      - name: Write Secrets.xcconfig
        env:
          IOS_SECRETS: ${{ secrets.IOS_SECRETS_XCCONFIG }}
        run: |
          test -n "${IOS_SECRETS}" || (echo "::error::IOS_SECRETS_XCCONFIG is empty" && exit 1)
          mkdir -p Config
          printf '%s\n' "$IOS_SECRETS" > Config/Secrets.xcconfig
      - name: Validate app service secrets
        run: |
          value_for() {
            awk -F= -v key="$1" '$1 ~ "^[[:space:]]*" key "[[:space:]]*$" {
              v=$2
              for (i=3; i<=NF; i++) v=v "=" $i
              gsub(/^[ \t]+|[ \t]+$/, "", v)
              print v
            }' Config/Secrets.xcconfig
          }

          supabase_url="$(value_for SUPABASE_URL)"
          supabase_key="$(value_for SUPABASE_ANON_KEY)"
          powersync_url="$(value_for POWERSYNC_URL)"
          resolved_supabase_url="$(printf '%s' "$supabase_url" | sed 's#/[$]()#/#g')"
          resolved_powersync_url="$(printf '%s' "$powersync_url" | sed 's#/[$]()#/#g')"

          case "$resolved_supabase_url" in
            ""|*\$"("*|*your-project.supabase.co*|*placeholder.supabase.co*)
              echo "::error::SUPABASE_URL is missing, unresolved, or still a placeholder"
              exit 1
              ;;
          esac

          case "$supabase_key" in
            ""|*\$"("*|*your-supabase-anon-key*)
              echo "::error::SUPABASE_ANON_KEY is missing, unresolved, or still a placeholder"
              exit 1
              ;;
          esac

          test "${#supabase_key}" -gt 40 || (echo "::error::SUPABASE_ANON_KEY is unexpectedly short" && exit 1)

          case "$resolved_powersync_url" in
            ""|*\$"("*|*your-instance.powersync.journeyapps.com*)
              echo "::error::POWERSYNC_URL is missing, unresolved, or still a placeholder"
              exit 1
              ;;
          esac
      - name: Write App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          test -n "${API_KEY_P8}" || (echo "::error::APP_STORE_CONNECT_API_KEY_P8 is empty" && exit 1)
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
      - name: Install signing certificate and profiles
        run: |
          test -n "${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" || (echo "::error::IOS_DISTRIBUTION_CERTIFICATE_BASE64 is empty" && exit 1)
          test -n "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" || (echo "::error::IOS_DISTRIBUTION_CERTIFICATE_PASSWORD is empty" && exit 1)
          test -n "${IOS_DIALD_PROFILE_BASE64}" || (echo "::error::IOS_DIALD_PROFILE_BASE64 is empty" && exit 1)
          test -n "${IOS_DIALD_WIDGETS_PROFILE_BASE64}" || (echo "::error::IOS_DIALD_WIDGETS_PROFILE_BASE64 is empty" && exit 1)
          test -n "${IOS_KEYCHAIN_PASSWORD}" || (echo "::error::IOS_KEYCHAIN_PASSWORD is empty" && exit 1)

          certificate_path="$RUNNER_TEMP/diald-distribution.p12"
          keychain_path="$RUNNER_TEMP/diald-signing.keychain-db"
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"

          mkdir -p "$profiles_dir"
          printf '%s' "$IOS_DIALD_PROFILE_BASE64" | base64 --decode > "$profiles_dir/Diald_App_Store.mobileprovision"
          printf '%s' "$IOS_DIALD_WIDGETS_PROFILE_BASE64" | base64 --decode > "$profiles_dir/Diald_Widgets_App_Store.mobileprovision"
      - run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" project.yml
      - if: env.APP_STORE_TEAM_ID != ''
        run: |
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"${APP_STORE_TEAM_ID}\"/" project.yml
      - run: xcodegen generate
      - run: xcodebuild -resolvePackageDependencies -project Diald.xcodeproj -scheme "$SCHEME"
      - name: Archive
        run: |
          xcodebuild archive \
            -project Diald.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH"
      - name: Validate archived app auth config
        run: |
          app_plist="$ARCHIVE_PATH/Products/Applications/Diald.app/Info.plist"
          test -f "$app_plist" || (echo "::error::Archived app Info.plist not found" && exit 1)

          supabase_url="$(plutil -extract SUPABASE_URL raw -o - "$app_plist")"
          supabase_key="$(plutil -extract SUPABASE_ANON_KEY raw -o - "$app_plist")"
          powersync_url="$(plutil -extract POWERSYNC_URL raw -o - "$app_plist")"

          case "$supabase_url" in
            ""|*\$"("*|*your-project.supabase.co*|*placeholder.supabase.co*)
              echo "::error::Archived app has missing, unresolved, or placeholder SUPABASE_URL"
              exit 1
              ;;
          esac

          case "$supabase_key" in
            ""|*\$"("*|*your-supabase-anon-key*)
              echo "::error::Archived app has missing, unresolved, or placeholder SUPABASE_ANON_KEY"
              exit 1
              ;;
          esac

          test "${#supabase_key}" -gt 40 || (echo "::error::Archived app SUPABASE_ANON_KEY is unexpectedly short" && exit 1)

          case "$powersync_url" in
            ""|*\$"("*|*your-instance.powersync.journeyapps.com*)
              echo "::error::Archived app has missing, unresolved, or placeholder POWERSYNC_URL"
              exit 1
              ;;
          esac
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
      - name: Upload to TestFlight
        run: |
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -1)
          test -n "$IPA" || (echo "::error::No .ipa produced" && exit 1)
          xcrun altool --upload-app --file "$IPA" --type ios --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"
