<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diald</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1b1410;
      color: #f4ece4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .wrap { padding: 32px; max-width: 540px; }
    h1 { font-size: 2.5rem; margin: 0 0 12px; }
    p { color: #b9a895; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 24px;
      color: #c98a4b;
      text-decoration: none;
      border: 1px solid #c98a4b;
      border-radius: 10px;
      padding: 10px 20px;
    }
    a:hover { background: #c98a4b; color: #1b1410; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Diald</h1>
    <p>A native iOS app for specialty coffee experiments &mdash; beans, extraction, ratios, brew methods, tasting notes, and stats.</p>
    <a href="./privacy-policy.html">Privacy Policy</a>
  </div>
</body>
</html>
