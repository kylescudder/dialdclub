# PowerSync sync rules for Diald.
#
# Uses edition 3 Sync Streams. Each stream is scoped to the authenticated
# Supabase user and excludes soft-deleted rows where the schema supports it.

config:
  edition: 3

streams:
  user_profile:
    auto_subscribe: true
    query: select * from profiles where id = auth.user_id() and deleted_at is null

  user_beans:
    auto_subscribe: true
    query: select * from beans where owner_id = auth.user_id() and deleted_at is null

  user_brew_sessions:
    auto_subscribe: true
    query: select * from brew_sessions where owner_id = auth.user_id() and deleted_at is null

  user_brew_steps:
    auto_subscribe: true
    query: select * from brew_steps where owner_id = auth.user_id() and deleted_at is null

  user_brew_reminders:
    auto_subscribe: true
    query: select * from brew_reminders where owner_id = auth.user_id() and deleted_at is null
